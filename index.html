<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#151515" />
  <title>Wimpy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #151515; --panel: #202020; --row: #333333; --text: #f5f2ec; --muted: #b8b2a8; --accent: #c5a46d; }
    body {
      min-height: 100vh; min-height: 100svh; padding: 34px 18px;
      display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: "DM Sans", sans-serif;
    }
    .social-card {
      width: min(100%, 770px); min-height: 850px; padding: 44px clamp(22px, 8vw, 92px) 48px;
      border-radius: 34px; background: var(--panel); display: flex; flex-direction: column;
      align-items: center; text-align: center;
    }
    .portrait {
      width: 164px; height: 164px; border-radius: 50%; overflow: hidden;
      border: 3px solid rgba(197,164,109,.8); padding: 4px; margin: 0 auto 28px;
    }
    .portrait img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .eyebrow { color: var(--accent); font-size: 10px; letter-spacing: 3px; margin-bottom: 12px; }
    h1 { font: 500 clamp(42px, 7vw, 58px)/1.1 "Playfair Display", serif; }
    .location { margin-top: 12px; color: var(--accent); font: 500 clamp(20px, 3.5vw, 27px) "Playfair Display", serif; }
    .role { margin-top: 30px; color: var(--muted); font: 500 12px "DM Sans", sans-serif; letter-spacing: 4px; text-transform: uppercase; }
    .links { width: 100%; display: grid; gap: 16px; margin-top: 68px; }
    .link-row {
      min-height: 76px; padding: 16px 22px; border-radius: 17px; background: var(--row);
      display: flex; align-items: center; justify-content: center; gap: 14px;
      color: var(--text); font: 600 clamp(19px, 3.5vw, 27px) "Playfair Display", serif;
      text-decoration: none; transition: background .2s ease, transform .2s ease;
    }
    .link-row:hover { background: #414141; transform: translateY(-2px); }
    .link-row .arrow { color: var(--accent); font: 18px "DM Sans", sans-serif; }
    .phone { margin-top: 25px; color: var(--muted); font-size: 15px; letter-spacing: 1px; text-decoration: none; }
    .footer-note { margin-top: auto; padding-top: 45px; color: #77736c; font-size: 9px; letter-spacing: 2.5px; }
    @media (max-width: 520px) {
      body { padding: 14px 10px; }
      .social-card { min-height: calc(100svh - 28px); border-radius: 25px; padding: 38px 22px 30px; }
      .portrait { width: 138px; height: 138px; margin-bottom: 24px; }
      .role { letter-spacing: 2.5px; font-size: 10px; }
      .links { margin-top: 48px; gap: 13px; }
      .link-row { min-height: 65px; border-radius: 14px; }
      .footer-note { padding: 35px 0 6px; }
    }
      .footer-notee { padding-top: 8px; font-size: 8px;color: #5F5F5D; }
    }
  </style>
</head>

</html>
